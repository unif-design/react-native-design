nodeLinker: node-modules
nmHoistingLimits: workspaces

yarnPath: .yarn/releases/yarn-4.11.0.cjs

# 只丢弃 react-native-reanimated-carousel@5.0.0 对 RNGH 的错误 metadata 告警(它声明
# `>=2.9.0 <3.0.0`,与本仓已验证的 RNGH 3 无交集)。两条 pattern 覆盖 Yarn 两种措辞;
# `yarn check:runtime-peers` 才是权威门禁,过滤只影响 install 日志噪声。
# RNRC 发布出正确接受 RNGH 3 的版本后,升级 RNRC 并在同一次改动中删掉这两条 filter
# 与 checker 里的 known-exception 分支。
logFilters:
  - pattern: "*react-native-gesture-handler*version 3.*doesn't satisfy*react-native-reanimated-carousel*"
    level: discard
  - pattern: '*react-native-gesture-handler*version 3.*does not satisfy*react-native-reanimated-carousel*'
    level: discard
