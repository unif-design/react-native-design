name: Design Example Showcase
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.scope.outputs.code == 'true' || steps.scope.outputs.instructions == 'true' || steps.inputs.outputs.contract == 'true' }}
      example: ${{ steps.scope.outputs.js == 'true' || steps.scope.outputs.shared == 'true' || steps.scope.outputs.example == 'true' }}
      tooling: ${{ steps.scope.outputs.tooling == 'true' || steps.scope.outputs.shared == 'true' }}
      checker: ${{ steps.inputs.outputs.checker == 'true' || steps.scope.outputs.manifest_runtime == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: scope
        uses: ./.github/actions/changes
      - name: Select showcase contract inputs
        id: inputs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            contract:
              - 'example/GUIDE.md'
              - '.pr_agent.toml'
              - '.gitattributes'
              - '.github/workflows/example-showcase.yml'
              - 'website/docusaurus.config.ts'
              - 'website/static/img/logo.png'
              - 'website/static/example-fixtures/media-decode-failure-v1.png'
            checker:
              - 'scripts/run-example-jest.mjs'
              - 'scripts/run-example-jest-focused.mjs'
              - 'example/jest.config.js'
              - 'example/jest.focused.config.js'
              - 'example/jest.forbidOnlyReporter.js'
              - 'example/jest.showcaseGate.js'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/releases/**'
              - '.nvmrc'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - 'scripts/verify-example-showcase.mjs'
              - 'scripts/__tests__/verify-example-showcase.test.mjs'
              - 'scripts/__tests__/example-showcase-contract.test.mjs'
              - '.github/workflows/example-showcase.yml'

  verify-example-showcase:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require change classification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - name: Checkout
        if: needs.changes.outputs.contract == 'true' || needs.changes.outputs.example == 'true' || needs.changes.outputs.tooling == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup
        if: needs.changes.outputs.contract == 'true' || needs.changes.outputs.example == 'true' || needs.changes.outputs.tooling == 'true'
        uses: ./.github/actions/setup
      - name: Check repository configuration
        if: needs.changes.outputs.contract == 'true'
        run: yarn check:config
      - name: Check runtime peers
        if: needs.changes.outputs.example == 'true' || needs.changes.outputs.tooling == 'true'
        run: yarn check:runtime-peers
      - name: Check generated icons
        if: needs.changes.outputs.contract == 'true'
        run: yarn check:icons
      - name: Check jest entries
        if: needs.changes.outputs.example == 'true' || needs.changes.outputs.tooling == 'true'
        run: |
          yarn check:jest-entries
          node --test "scripts/__tests__/jest-*.test.mjs"
      - name: Verify current example showcase contract
        if: needs.changes.outputs.contract == 'true'
        run: node scripts/verify-example-showcase.mjs --check
      - name: Test example showcase verifier
        if: needs.changes.outputs.checker == 'true'
        run: yarn verify:example-showcase
      - name: Typecheck example
        if: needs.changes.outputs.example == 'true'
        run: yarn example typecheck
      - name: Lint example
        if: needs.changes.outputs.example == 'true'
        run: yarn example lint
      - name: Test example
        if: needs.changes.outputs.example == 'true'
        run: yarn example test --maxWorkers=2
